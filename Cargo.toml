[workspace]
resolver = "2"
members = ["crates/protocol", "crates/client", "crates/daemon", "crates/mcp", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
recurse-protocol = { path = "crates/protocol" }
recurse-client = { path = "crates/client" }
recurse-daemon = { path = "crates/daemon" }
recurse-mcp = { path = "crates/mcp" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "io-util", "process", "time", "net", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
base64 = "0.22"
libc = "0.2"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
